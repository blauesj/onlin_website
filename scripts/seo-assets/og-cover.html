<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>OG cover 1200x630</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b0b14; }
  body { width: 1200px; height: 630px; overflow: hidden; }
  svg { display: block; }
</style>
</head>
<body>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14112e"/>
      <stop offset="0.55" stop-color="#0d0d18"/>
      <stop offset="1" stop-color="#0b0b14"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b4bff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5b4bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff7a59" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ff7a59" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#c9c1ff"/>
      <stop offset="1" stop-color="#ff9478"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7dff"/>
      <stop offset="1" stop-color="#5b4bff"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 光斑 -->
  <ellipse cx="960" cy="180" rx="380" ry="300" fill="url(#glowA)" filter="url(#soft)"/>
  <ellipse cx="1060" cy="520" rx="300" ry="230" fill="url(#glowB)" filter="url(#soft)"/>

  <!-- 细网格 -->
  <g stroke="#ffffff" stroke-opacity="0.045" stroke-width="1">
    <path d="M0 105h1200M0 210h1200M0 315h1200M0 420h1200M0 525h1200"/>
    <path d="M150 0v630M300 0v630M450 0v630M600 0v630M750 0v630M900 0v630M1050 0v630"/>
  </g>

  <!-- 右侧靶环 -->
  <g transform="translate(945 315)">
    <circle r="188" fill="none" stroke="#8b7dff" stroke-opacity="0.16" stroke-width="1.5"/>
    <circle r="146" fill="none" stroke="#8b7dff" stroke-opacity="0.24" stroke-width="1.5"/>
    <circle r="104" fill="none" stroke="url(#ring)" stroke-opacity="0.72" stroke-width="3"/>
    <circle r="104" fill="none" stroke="#8b7dff" stroke-opacity="0.35" stroke-width="14" filter="url(#soft)"/>
    <circle r="52" fill="url(#ring)"/>
    <circle r="52" fill="#5b4bff" fill-opacity="0.6" filter="url(#soft)"/>
    <circle r="20" fill="#ffffff"/>
    <!-- 小目标点 -->
    <circle cx="-196" cy="-118" r="11" fill="#ff7a59"/>
    <circle cx="168" cy="-186" r="8" fill="#ffc04d"/>
    <circle cx="214" cy="126" r="9" fill="#8b7dff"/>
    <circle cx="-158" cy="176" r="7" fill="#ff9478"/>
  </g>

  <!-- 文字 -->
  <text x="88" y="132" fill="#8b8b99" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="19" font-weight="700" letter-spacing="5.2">NEON COMBO</text>

  <text x="84" y="272" fill="url(#txt)" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif"
        font-size="104" font-weight="800" letter-spacing="2">霓虹连击</text>

  <text x="88" y="368" fill="#f2f2f7" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif"
        font-size="42" font-weight="700" letter-spacing="0.5">30 秒连击挑战</text>

  <text x="88" y="428" fill="#a8a8b8" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif"
        font-size="25" font-weight="400">点亮 · 命中 · 别断连</text>

  <!-- 规则小条 -->
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20" font-weight="600">
    <rect x="88" y="470" width="150" height="46" rx="23" fill="#ffffff" fill-opacity="0.07"/>
    <text x="163" y="499" fill="#c9c1ff" text-anchor="middle">+10 / 命中</text>
    <rect x="252" y="470" width="140" height="46" rx="23" fill="#ffffff" fill-opacity="0.07"/>
    <text x="322" y="499" fill="#ffc04d" text-anchor="middle">倍率 ×5</text>
    <rect x="406" y="470" width="140" height="46" rx="23" fill="#ffffff" fill-opacity="0.07"/>
    <text x="476" y="499" fill="#ff9478" text-anchor="middle">金环 +50</text>
  </g>

  <text x="88" y="580" fill="#6a6a7c" font-family="Segoe UI, Arial, sans-serif"
        font-size="18" font-weight="500" letter-spacing="1.4">home.prettylife.pw</text>
</svg>
</body>
</html>
