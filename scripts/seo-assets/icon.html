<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>App icon</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b0b14; }
  svg { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="core" cx="34%" cy="28%" r="76%">
      <stop offset="0" stop-color="#d8d2ff"/>
      <stop offset="0.42" stop-color="#8b7dff"/>
      <stop offset="1" stop-color="#5b4bff"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16132f"/>
      <stop offset="1" stop-color="#0b0b14"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <circle cx="256" cy="256" r="168" fill="none" stroke="#8b7dff" stroke-opacity="0.22" stroke-width="10"/>
  <circle cx="256" cy="256" r="124" fill="none" stroke="#8b7dff" stroke-opacity="0.42" stroke-width="12"/>
  <circle cx="256" cy="256" r="96" fill="none" stroke="#8b7dff" stroke-opacity="0.55" stroke-width="20" filter="url(#soft)"/>

  <circle cx="256" cy="256" r="86" fill="url(#core)"/>
  <circle cx="256" cy="256" r="34" fill="#ffffff"/>

  <circle cx="88" cy="150" r="20" fill="#ff7a59"/>
  <circle cx="424" cy="330" r="16" fill="#ffc04d"/>
  <circle cx="372" cy="104" r="11" fill="#8b7dff"/>
  <circle cx="140" cy="392" r="13" fill="#ff9478"/>
</svg>
</body>
</html>
