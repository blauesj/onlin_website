<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>404 · 霓虹连击 NEON COMBO</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center;
      padding: 24px; background: #f7f7fb; color: #16161d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .code {
      font-size: clamp(84px, 19vw, 168px); font-weight: 850; line-height: 1; letter-spacing: -.08em;
      background: linear-gradient(120deg, #5b4bff, #ff7a59);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    h1 { font-size: 26px; margin: 14px 0 10px; letter-spacing: -.03em; }
    p { color: #5d5d6b; margin: 0 0 28px; font-size: 15px; }
    p.en { color: #8b8b99; font-size: 13.5px; margin-top: -22px; }
    a {
      display: inline-block; padding: 13px 28px; border-radius: 999px;
      background: #5b4bff; color: #fff; text-decoration: none; font-weight: 650; font-size: 15px;
      transition: transform .2s ease, opacity .2s ease;
    }
    a:hover { opacity: .9; transform: translateY(-2px); }
    .meta {
      margin-top: 40px; font-size: 10px; font-weight: 700; letter-spacing: .18em;
      text-transform: uppercase; color: #8b8b99;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0e0e15; color: #f2f2f7; }
      p { color: #a8a8b8; }
      p.en, .meta { color: #7a7a8c; }
    }
  </style>
</head>
<body>
  <div>
    <div class="code">404</div>
    <h1>这一局，没找到目标。</h1>
    <p>你要的页面不存在，或者已经搬走了。</p>
    <p class="en" lang="en">This round has no target — the page is gone or never existed.</p>
    <a href="/">回到游戏 / Back to the game</a>
    <p class="meta">NEON COMBO · 30-SECOND CHALLENGE</p>
  </div>
</body>
</html>
