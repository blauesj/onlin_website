<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>页面走丢了 · 屿光 YUGUANG</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center;
      padding: 24px; background: #f7f7fb; color: #16161d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .code { font-size: clamp(80px, 18vw, 160px); font-weight: 800; line-height: 1; letter-spacing: -.08em;
      background: linear-gradient(120deg, #5b4bff, #ff7a59); -webkit-background-clip: text; background-clip: text; color: transparent; }
    h1 { font-size: 26px; margin: 12px 0 10px; letter-spacing: -.03em; }
    p { color: #5d5d6b; margin: 0 0 30px; }
    a { display: inline-block; padding: 12px 26px; border-radius: 999px; background: #5b4bff; color: #fff; text-decoration: none; font-weight: 600; }
    a:hover { opacity: .88; }
    @media (prefers-color-scheme: dark) {
      body { background: #0e0e15; color: #f2f2f7; }
      p { color: #a8a8b8; }
    }
  </style>
</head>
<body>
  <div>
    <div class="code">404</div>
    <h1>这个页面走丢了</h1>
    <p>链接可能已经变更，回首页看看别的内容吧。</p>
    <a href="/">返回首页</a>
  </div>
</body>
</html>
